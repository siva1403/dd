name: CodeQL Scan

on:
  push:
  pull_request:

jobs:
  analyze:
    runs-on: self-hosted

    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/analyze@v3