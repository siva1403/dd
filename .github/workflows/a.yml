# .github/workflows/test.yml
name: Local Runner Test

on:
  push:
jobs:
  codeql-scan:
    name: Codeql Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t webhook-app .

      - name: Stop old container (if exists)
        run: docker rm -f webhook-container || true

      - name: Run container
        run: |
          docker run -d -p 5000:5000 \
          --name webhook-container \
          -e TOLEN=${{ secrets.TOLEN }} \
          webhook-app